<script>
    const token = localStorage.getItem("token");

    if (!token) {
        alert("Please login first.");
        window.location.href = "login.html";
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Blog Application</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            📝 Blog Application
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-blog.html">Create Blog</a>
            <button onclick="logout()">Logout</button>
        </div>

    </nav>


    <!-- Dashboard -->
    <main class="container">

        <h1 id="welcomeUser">
            Welcome!
        </h1>

        <div class="dashboard-header">

            <h2>My Blogs</h2>

            <a href="create-blog.html" class="btn">
                ✍️ Create New Blog
            </a>

        </div>


        <!-- User's blogs appear here -->
        <div id="myBlogs">

            <div class="blog-card">
                <h3>Loading your blogs...</h3>
                <p>Please wait...</p>
            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Blog Application
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
