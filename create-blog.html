<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogHub - Create Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <h2>BlogHub</h2>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
        </div>
    </nav>
</header>

<div class="form-container blog-form">

    <h1>Create New Blog</h1>

    <form id="blogForm">

        <label>Blog Title</label>
        <input type="text" id="blogTitle" placeholder="Enter blog title" required>

        <label>Category</label>

        <select id="blogCategory" required>
            <option value="">Select Category</option>
            <option value="Technology">Technology</option>
            <option value="Education">Education</option>
            <option value="Travel">Travel</option>
            <option value="Food">Food</option>
            <option value="Lifestyle">Lifestyle</option>
        </select>

        <label>Blog Content</label>

        <textarea
            id="blogContent"
            rows="10"
            placeholder="Write your blog here..."
            required>
        </textarea>

        <button type="submit" class="btn">Publish Blog</button>

    </form>

</div>

<script src="js/script.js"></script>

</body>
</html>
